name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t symfony-devops-lab .

      - name: Run PHPUnit
        run: docker run --rm symfony-devops-lab php bin/phpunit

      - name: Check code style
        run: docker run --rm symfony-devops-lab php vendor/bin/php-cs-fixer fix --dry-run --diff